name: Firmware CI
on:
  pull_request:
    paths:
      - 'samples/reference-firmware/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'tests/**'
      - 'examples/**'
      - 'site/**'
      - 'moaw/**'
      - 'README.md'
  push:
    branches: ['main', 'workshop/**']
    paths:
      - 'samples/reference-firmware/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'tests/**'
      - 'examples/**'
      - 'site/**'
      - 'moaw/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      quality:
        description: Enable optional quality gates
        type: boolean
        default: false
      sbom:
        description: Generate an optional pre-release SPDX SBOM
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/firmware-build.yml
    with:
      quality: ${{ inputs.quality == true }}
      sbom: ${{ inputs.sbom == true }}
